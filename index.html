.tenGrid{display:grid;grid-template-columns:repeat(5,minmax(42px,1fr));gap:5px;max-width:320px;margin:7px auto}.previewGrid{max-width:360px}.moveObj{touch-action:none;user-select:none}.bundleDrag{touch-action:none;user-select:none}.carryInteract,.borrowInteract{margin-top:12px}.placeBox{padding:10px}.finalDiagram{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap}.finalCol{min-width:125px;text-align:center;padding:8px;border:2px solid #e2e6ec;border-radius:15px;background:#fff}.hiddenAnswerNote{font-size:17px;font-weight:900;text-align:center;margin-top:8px;background:#fff8df;padding:9px;border-radius:12px}.transformBox{margin-top:10px;padding:10px;border-radius:14px;background:#fafbfc;border:2px solid #e2e6ec;text-align:center}.resultTitle{font-weight:900;margin-bottom:7px}.previewGrid .cell{height:45px;font-size:25px}.tenGrid .cell{height:45px;font-size:25px}.finishChoice{display:block;position:relative;z-index:10;margin-top:18px;padding:18px;border-radius:22px;background:#fff8df;border:3px solid #ead36a;text-align:center}.finishTitle{font-size:26px;font-weight:950}.finishText{font-size:19px;font-weight:850;margin:7px 0 14px}.finishButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.finishBtn{border:0;border-radius:18px;padding:17px 10px;font-size:20px;font-weight:950}.transformClean{padding:12px;border-radius:18px;background:#fff;border:2px solid #e2e6ec;text-align:center}.finalNumberVisual{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin:8px 0}.numberPart{min-width:135px;padding:10px;border-radius:16px;border:2px solid #e2e6ec;background:#fafbfc;text-align:center}.numberPart .big{font-size:42px;font-weight:950}.numberPart .small{font-weight:850;margin-top:3px}
.tenBundlePreview{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}

.countBoard,.tenConceptBoard{max-width:520px;margin:12px auto;padding:12px;border:3px solid #dfe4ea;border-radius:20px;background:#fff}.countBoard .row,.tenConceptBoard .row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:7px}.countBoard .cell,.tenConceptBoard .cell{min-height:54px;font-size:32px}.tenConceptBoard .cell.empty{background:#f3f5f8;border:2px dashed #b8c0ca}.tenConceptBoard .cell.added{background:#fff1c7;border-color:#e7bd4b}.addedObject{background:#fff1c7!important;border:3px solid #e7bd4b!important}.borrowChangedDiagram{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.borrowChangedDiagram .borrowed,.borrowNewSrc .borrowed{background:#dcecff!important;border-color:#5d8fd8!important}.borrowExplain{text-align:center;margin-top:8px;font-weight:850}.borrowNewSrc{margin:12px auto}.borrowAvailable{margin:12px auto;padding:10px;border:3px solid #b8c8e8;border-radius:18px;background:#f8fbff}.borrowTakeNew{margin-top:10px;border:3px dashed #e0b84c!important;background:#fffaf0!important}.borrowBlue{background:#dcecff!important;border-color:#5d8fd8!important}.borrowAvailable .row{margin-bottom:7px}.borrowAvailable .cell{height:48px}.borrowPhaseTitle{font-size:19px;font-weight:950;text-align:center;margin:10px 0 6px}

<body><div id="app"></div>
<script>
'use strict';
const app=document.getElementById('app');
let G={last:0};

function B(id,text,cl='secondary'){return '<button id="'+id+'" class="btn '+cl+'">'+text+'</button>'}
function board(n,e='🍎',rows=2){n=Math.max(0,n);let s='<div class="board">';for(let r=0;r<rows;r++){s+='<div class="row">';for(let c=0;c<5;c++){let i=r*5+c;s+='<div class="cell">'+(i<n?e:'')+'</div>'}s+='</div>'}return s+'</div>'}
function bundle(e='🍎'){return '<div class="note" style="font-size:25px">🔟 10개 묶음</div>'+board(10,e)}
function bundles(n,e='🍎'){let s='<div class="columns">';for(let i=0;i<n;i++)s+='<div class="col">'+bundle(e)+'</div>';return s+'</div>'}

function numericAnswers(correct,onCorrect){
  const area=document.getElementById('answers');
  if(!area)return;
  const set=new Set([correct]);
  while(set.size<3){
    const d=1+Math.floor(Math.random()*4);
    const v=Math.random()<0.5?correct-d:correct+d;
    if(v>=0)set.add(v);
  }
  const choices=[...set].sort(()=>Math.random()-0.5);
  area.innerHTML=choices.map(v=>`<button class="ans" data-value="${v}">${v}</button>`).join('');
  area.querySelectorAll('.ans').forEach(btn=>{
    btn.onclick=()=>{
      const v=Number(btn.dataset.value);
      if(v===correct){
        btn.classList.add('right');
        area.querySelectorAll('.ans').forEach(b=>b.disabled=true);
        onCorrect();
      }else{
        btn.classList.add('wrong');
        btn.disabled=true;
      }
    };
  });
}

function retry(next){
  const card=document.querySelector('.card');
  if(!card)return;
  const old=card.querySelector('.finishChoice'); if(old)old.remove();
  const box=document.createElement('div'); box.className='finishChoice';
  box.innerHTML='<div class="finishTitle">🎉 정답이에요!</div><div class="finishText">다음은 어떻게 할까요?</div><div class="finishButtons"><button id="againBtn" class="finishBtn primary">한번 더 풀어보기</button><button id="menuBtn" class="finishBtn secondary">메뉴로 돌아가기</button></div>';
  card.appendChild(box);
  box.querySelector('#againBtn').addEventListener('click',()=>next());
  box.querySelector('#menuBtn').addEventListener('click',()=>menu());
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function menu(){
app.innerHTML='<div class="app"><div class="top"><h1>🍎 수학놀이터</h1><div class="sub">그림으로 생각하고 손으로 움직여요</div></div><div class="card"><div class="menu">'+
'<button id="m1">① 수 세기</button><button id="m2">② 🔟 10의 개념</button><button id="m3">③ 덧셈</button><button id="m4">④ 뺄셈</button><button id="m5">⑤ 받아올림</button><button id="m6">⑥ 받아내림</button></div></div></div>';
m1.onclick=countStage;m2.onclick=tenStage;m3.onclick=addStage;m4.onclick=subStage;m5.onclick=carryStage;m6.onclick=borrowStage;
}

/* robust iPad drag engine: touch-only, no native HTML5 drag */
function makeDraggable(el,onDrop){
let sx=0,sy=0,ghost=null,moved=false;
const cleanup=()=>{document.removeEventListener('touchmove',move,{passive:false});document.removeEventListener('touchend',end,{passive:false});document.removeEventListener('touchcancel',cancel,{passive:false});if(ghost){ghost.remove();ghost=null}document.querySelectorAll('.dropTarget').forEach(x=>x.classList.remove('dropTarget'))};
const move=e=>{e.preventDefault();let t=e.touches[0];if(!ghost)return;ghost.style.left=(t.clientX-sx)+'px';ghost.style.top=(t.clientY-sy)+'px';document.querySelectorAll('.dropTarget').forEach(x=>x.classList.remove('dropTarget'));let d=document.elementFromPoint(t.clientX,t.clientY);let target=d&&d.closest('[data-drop="yes"]');if(target)target.classList.add('dropTarget');moved=true};
const end=e=>{e.preventDefault();let t=e.changedTouches[0],d=document.elementFromPoint(t.clientX,t.clientY),target=d&&d.closest('[data-drop="yes"]');cleanup();if(target)onDrop(target)};
const cancel=e=>{e.preventDefault();cleanup()};
el.addEventListener('touchstart',e=>{
e.preventDefault();let t=e.touches[0],r=el.getBoundingClientRect();sx=t.clientX-r.left;sy=t.clientY-r.top;moved=false;
ghost=el.cloneNode(true);ghost.className+=' ghost';ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';ghost.style.left=(t.clientX-sx)+'px';ghost.style.top=(t.clientY-sy)+'px';document.body.appendChild(ghost);
document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',end,{passive:false});document.addEventListener('touchcancel',cancel,{passive:false});
},{passive:false});
}

/* ① */
function countStage(){
  let n=5+Math.floor(Math.random()*16); const rows=Math.ceil(n/5);
  app.innerHTML='<div class="app"><button id="back" class="back">← 메뉴</button><div class="card"><h2 style="text-align:center">① 몇 개인지 세어 보세요</h2><div class="msg">5개씩 줄을 맞춘 배열판을 보고 한눈에 알아봐요.</div><div class="countBoard">'+Array.from({length:rows},(_,r)=>'<div class="row">'+Array.from({length:5},(_,c)=>{let i=r*5+c;return '<div class="cell '+(i<n?'filled':'')+'">'+(i<n?['🍎','🍐','🍊','🍓'][i%4]:'')+'</div>'}).join('')+'</div>').join('')+'</div><div class="eq">몇 개일까요?</div><div id="answers" class="answerGrid"></div><div id="st" class="status">5개씩 묶어 보면서 몇 개인지 생각해 보세요.</div></div></div>';
  back.onclick=menu; numericAnswers(n,()=>{st.innerHTML='🎉 '+n+'개예요! 5개씩 묶어서 잘 알아봤어요.';retry(countStage)})
}

/* ② */
function tenStage(){
  const targets=[10,20,30]; const target=targets[Math.floor(Math.random()*targets.length)];
  const base=5+Math.floor(Math.random()*5);
  const firstNeed=10-base; let moved=0;
  app.innerHTML=`<div class="app"><button id="back" class="back">← 메뉴</button><div class="card">
    <h2 style="text-align:center">② 🔟 10의 개념</h2><div class="carryEquation">🎯 ${target} 만들기</div>
    <div id="tenGuide" class="msg">먼저 <b>${base}개</b>가 있어요.<br><b>${firstNeed}개</b>를 더 옮겨 10칸을 채워 보세요.</div>
    <div id="tenConceptBoard" class="tenConceptBoard" data-drop="yes"></div>
    <div class="label">부족한 사물 · ${firstNeed}개</div><div id="tenObjSrc" class="bundleSource"></div>
    <div id="tenStatus" class="status">빈칸: <b>${firstNeed}칸</b></div><div id="tenNextArea"></div>
  </div></div>`;
  back.onclick=menu;
  const board=document.getElementById('tenConceptBoard');
  function drawBoard(extra=0){board.innerHTML='<div class="row">'+Array.from({length:10},(_,i)=>i<base?'<div class="cell filled">🍎</div>':i<base+extra?'<div class="cell filled added">🍐</div>':'<div class="cell empty">&nbsp;</div>').join('')+'</div>'}
  function completeTen(){
    tenGuide.innerHTML='🎉 10칸을 모두 채웠어요! <b>10개가 되었어요.</b><br>이 10개를 🔟 1묶음으로 생각해 볼까요?';
    tenStatus.innerHTML='🎉 10개 완성!';
    document.getElementById('tenObjSrc').style.display='none';
    const bundlesNeeded=Math.floor(target/10);
    const remain=target%10;
    if(bundlesNeeded===1){
      tenNextArea.innerHTML='<div class="transformClean"><div class="resultTitle">🔟 10개 = 1묶음</div><div class="finalNumberVisual"><div class="numberPart"><div class="big">🔟</div><div class="small">10개를 한 묶음으로 만들었어요</div></div></div></div><div id="answers" class="answerGrid"></div><div class="msg">10을 잘 만들었어요! 몇 개일까요?</div>';
      numericAnswers(target,()=>{tenGuide.innerHTML='🎉 10을 잘 만들었어요!';retry(tenStage)});
      return;
    }
    const extra=bundlesNeeded-1;
    tenNextArea.innerHTML='<div class="transformClean"><div class="resultTitle">🔟 방금 만든 10은 1묶음이에요.</div><div class="finalNumberVisual"><div class="numberPart"><div class="big">🔟</div><div class="small">먼저 만든 10</div></div><div class="plus">+</div><div class="numberPart"><div class="big">'+remain+'개</div><div class="small">남는 사물</div></div></div></div><div class="msg">이제 🔟 묶음 <b>'+extra+'개</b>를 더 옮겨 <b>'+target+'</b>을 만들어 보세요.</div><div id="bundleBoard" class="bundleBoard" data-drop="yes"></div><div id="bundleSrc" class="bundleSource"></div><div id="bundleStatus" class="status">이미 만든 🔟 1개 + 옮긴 묶음 0개 / '+extra+'개</div><div id="answers" class="answerGrid" style="display:none"></div>';
    let placed=0; const bb=document.getElementById('bundleBoard'), bs=document.getElementById('bundleSrc');
    bb.innerHTML='<div class="bundleSlot filled">🔟</div>'+Array.from({length:extra},()=>'<div class="bundleSlot"></div>').join('');
    for(let i=0;i<extra;i++){
      let x=document.createElement('button');x.className='tenBundle';x.textContent='🔟';
      makeDraggable(x,t=>{
        if(t.id!=='bundleBoard'||placed>=extra)return;
        let slot=bb.querySelector('.bundleSlot:not(.filled)');if(!slot)return;
        slot.textContent='🔟';slot.classList.add('filled');placed++;x.remove();
        bundleStatus.innerHTML='이미 만든 🔟 1개 + 옮긴 묶음 <b>'+placed+'</b>개 / '+extra+'개';
        if(placed===extra){
          tenGuide.innerHTML='🎉 다 옮겨서 <b>'+target+'</b>을 잘 만들었어요!';
          bundleStatus.innerHTML='🎉 '+target+' 완성!';
          const area=document.getElementById('answers');area.style.display='flex';
          numericAnswers(target,()=>{bundleStatus.innerHTML='🎉 정답이에요!';retry(tenStage)});
        }
      });
      bs.appendChild(x);
    }
  }
  drawBoard(); const src=document.getElementById('tenObjSrc');
  for(let i=0;i<firstNeed;i++){let x=document.createElement('button');x.className='object addedObject';x.textContent='🍐';makeDraggable(x,t=>{if(t.id!=='tenConceptBoard'||moved>=firstNeed)return;moved++;x.remove();drawBoard(moved);tenStatus.innerHTML='빈칸: <b>'+(firstNeed-moved)+'칸</b>';if(moved===firstNeed)completeTen()});src.appendChild(x)}
}
function addStage(){
  let a=5+Math.floor(Math.random()*4), b=5+Math.floor(Math.random()*4), total=a+b;
  let movedA=0,movedB=0;

    <div id="secondAvailable" class="borrowAvailable"></div>
    <div id="secondTake" class="placeBox takeBox borrowTakeNew" data-drop="yes"><div class="dropHint">뺀 곳 · ${b}개</div><div id="secondTakenItems" class="tenGrid"></div></div>
    <div id="secondStatus" class="status">원래 사물: <b>0</b> / ${ones}개 · 새로 생긴 10개: 🔒 먼저 기다려요</div>`;

    const avail=document.getElementById('secondAvailable');
    const secondTaken=document.getElementById('secondTakenItems');
    const secondStatus=document.getElementById('secondStatus');
    const original=[];
    const broken=[];

    // 5칸씩 줄을 맞춘 배열판. 원래 있던 사물과 새로 풀린 사물을 색으로 구분한다.
    const totalAvail=ones+10;
    for(let i=0;i<totalAvail;i++){
      const x=document.createElement('button');
      const isBroken=i>=ones;
      x.className='moveObj'+(isBroken?' borrowBlue':'');
      x.textContent='🍎';
      if(isBroken){x.disabled=true;x.style.opacity='.42';}
      avail.appendChild(x);
      (isBroken?broken:original).push(x);

      makeDraggable(x,target=>{
        if(target.id!=='secondTake' || secondTaken.children.length>=b || x.disabled)return;
        secondTaken.appendChild(x);
        const n=secondTaken.children.length;
        const origMoved=Math.min(n,ones);
        const brokenMoved=Math.max(0,n-ones);
        secondStatus.innerHTML='원래 사물: <b>'+origMoved+' / '+ones+'개</b> · 새로 생긴 10개: <b>'+brokenMoved+' / '+missing+'개 필요</b>';
        if(origMoved===ones){
          // 원래 사물을 모두 옮긴 바로 그 순간 새로 생긴 10개를 활성화한다.
          broken.forEach(o=>{o.disabled=false;o.style.opacity='1';});
          secondStatus.innerHTML='👏 원래 '+ones+'개를 모두 옮겼어요! 이제 🔵 새로 생긴 10개에서 <b>'+missing+'개</b>를 이어서 옮겨요.';
        }
        if(n===b)finish();
      });
    }
  }

  function finish(){
    const remain=ones+10-b;
    borrowResult.innerHTML=`<div class="resultTitle">🎉 ${b}개를 모두 뺐어요!</div>
      <div class="finalDiagram">
        <div class="finalCol"><b>십의 자리</b><div class="tenRow">${pack(tens-1)}</div><div>${tens-1}개의 10묶음</div></div>
        <div class="finalCol"><b>일의 자리</b>${staticGrid(remain)}<div>${remain}개가 남았어요</div></div>
      </div>
      <div class="hiddenAnswerNote">🔟 1묶음을 풀어 ${ones}+10=${ones+10}개가 되었고, 그중 ${b}개를 뺐어요.</div>`;
    borrowGuide.innerHTML='👏 아주 잘했어요! <b>'+b+'개</b>를 모두 뺐어요. 남은 그림을 보고 답을 골라 보세요.';
    numericAnswers(ans,()=>{st.innerHTML='🎉 정답이에요!';retry(borrowStage)});
  }
}

menu();
</script>
</body>
</html>
