<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>수학놀이터 V6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f8ff;color:#26354d;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;border:0;cursor:pointer}
.app{max-width:1150px;margin:auto;padding:18px 16px 40px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.title{font-size:30px;font-weight:900}.sub{font-size:14px;color:#75839a;margin-top:3px}
.parent{background:#fff;border:2px solid #dce4f1;border-radius:17px;padding:11px 14px;font-weight:900}
.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 8px 30px rgba(52,72,110,.08)}
h1,h2{margin:4px 0 8px}.hint{color:#6f7d93;margin:0 0 18px;line-height:1.5}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.menu button{min-height:115px;text-align:left;background:#fff;border:2px solid #e5eaf2;border-radius:23px;padding:17px}
.menu .e{font-size:32px}.menu b{display:block;font-size:19px;margin-top:6px}.menu small{display:block;color:#7c879a;margin-top:4px}
.back{background:#edf1f8;border-radius:14px;padding:10px 15px;font-weight:900;margin-bottom:14px}
.progress{height:10px;background:#e9edf5;border-radius:99px;overflow:hidden;margin:13px 0 18px}.bar{height:100%;width:0;background:#ffd84d;transition:.35s}
.question{text-align:center;font-size:26px;font-weight:900;margin:12px 0}.visual{min-height:150px;display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap}.obj{font-size:39px;line-height:1}
.answers{max-width:550px;margin:18px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answers button,.choice button{background:#f1f4fa;border:2px solid #e0e6ef;border-radius:18px;padding:17px;font-size:23px;font-weight:900}
.feedback{text-align:center;min-height:34px;font-size:18px;font-weight:900}.next{display:none;background:#263650;color:#fff;border-radius:17px;padding:13px 24px;font-weight:900}
.center{text-align:center}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px}.pile{background:#f8f9fc;border-radius:21px;padding:17px;text-align:center;min-height:185px}.pile h3{margin:0 0 12px}.choice{display:flex;justify-content:center;gap:10px;margin:15px 0}.choice button{background:#ffd84d}
.numline{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:18px}.num{width:52px;height:52px;background:#eef2f8;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.place{display:flex;justify-content:center;gap:20px;align-items:stretch;margin:20px auto;max-width:650px}.placebox{flex:1;background:#f7f9fc;border-radius:22px;padding:16px}.blocks{display:flex;flex-wrap:wrap;justify-content:center;min-height:90px}.ten{width:115px;height:40px;background:#dfe6f3;border-radius:8px;margin:4px;font-size:24px}.one{width:32px;height:32px;background:#fff;border:2px solid #dce3ef;border-radius:8px;margin:4px;font-size:20px}
.tenboard{display:grid;grid-template-columns:1fr 1fr;gap:15px}.zone{background:#f7f9fc;border:3px dashed #d9e1ef;border-radius:21px;padding:15px;min-height:190px;text-align:center}.zone h3{margin:0 0 10px}.dragitem{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;background:#fff;border:2px solid #dce3ec;border-radius:15px;margin:4px;font-size:29px;touch-action:none}.sumvisual{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;font-size:30px}
.vline{max-width:800px;margin:20px auto;padding:30px 5px 10px;position:relative}.ticks{display:flex;justify-content:space-between;border-top:4px solid #8b98aa}.tick{position:relative;width:1px;height:22px;border-left:3px solid #8b98aa}.tick span{position:absolute;top:25px;left:-9px;font-weight:900}.jump{font-size:22px;font-weight:900;text-align:center;margin-top:25px}
.calc{display:inline-grid;grid-template-columns:auto auto;gap:2px;text-align:right;font-size:44px;font-weight:900;line-height:1.1;margin:10px}.calc .sign{padding-right:14px}.calc .line{grid-column:1/3;border-top:5px solid #26354d}
.explain{background:#fff8d8;border-radius:20px;padding:16px;max-width:720px;margin:14px auto;text-align:center;font-size:18px;line-height:1.6}
.stats{display:grid;gap:10px}.stat{display:flex;justify-content:space-between;padding:15px;background:#f6f8fc;border-radius:16px;font-weight:800}.reset{background:#edf1f8;padding:12px 16px;border-radius:15px;font-weight:800;margin-top:12px}
.badge{display:inline-block;background:#fff1a8;border-radius:99px;padding:7px 11px;font-weight:900;font-size:13px}
@media(min-width:760px){.menu{grid-template-columns:repeat(3,1fr)}.app{padding:28px}}
</style>
<style>.foodrow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.foodcard{background:#fff;border:2px solid #e2e7f0;border-radius:18px;padding:8px 12px;font-weight:800}.foodcard .big{font-size:34px;display:block}.mixGroups{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:15px auto}.mixGroup{padding:10px 12px;border-radius:18px;background:#f8f9fc;border:2px solid #e0e6ef;min-width:145px}.mixGroup b{display:block;margin-bottom:7px}</style></head>
<body>
<div class="app">
<header class="header"><div><div class="title">🌈 수학놀이터 V6</div><div class="sub">수의 뜻을 보고, 만지고, 생각해요</div></div><button class="parent" onclick="show('parent')">👨‍👩‍👧 부모님</button></header>

<section id="home" class="screen active"><div class="card">
<h2>오늘은 어디까지 해볼까요?</h2><p class="hint">아이의 수준에 맞게 시작하세요. <b>1단계부터 순서대로</b> 해보는 것을 권합니다.</p>
<div class="menu">
<button onclick="start('count')"><span class="e">🔢</span><b>1단계 · 수의 개념</b><small>1~20, 수량과 숫자, 비교, 순서</small></button>
<button onclick="start('ten')"><span class="e">🔟</span><b>2단계 · 10의 개념</b><small>10 묶음, 낱개, 10 만들기</small></button>
<button onclick="start('add')"><span class="e">➕</span><b>3단계 · 한 자리 덧셈</b><small>그림과 수직선으로 더하기</small></button>
<button onclick="start('sub')"><span class="e">➖</span><b>3단계 · 한 자리 뺄셈</b><small>그림과 수직선으로 빼기</small></button>
<button onclick="start('place')"><span class="e">🧱</span><b>4단계 · 두 자리 수</b><small>십의 자리와 일의 자리</small></button>
<button onclick="start('add2')"><span class="e">🧩</span><b>5단계 · 두 자리 덧셈</b><small>묶음과 낱개로 계산하기</small></button>
<button onclick="start('sub2')"><span class="e">📦</span><b>5단계 · 두 자리 뺄셈</b><small>십과 일을 나누어 생각하기</small></button>
<button onclick="start('carry')"><span class="e">⬆️</span><b>6단계 · 받아올림</b><small>10개가 모이면 한 묶음</small></button>
<button onclick="start('borrow')"><span class="e">⬇️</span><b>6단계 · 받아내림</b><small>한 묶음을 낱개로 풀기</small></button>
</div></div></section>

<section id="lesson" class="screen"><button class="back" onclick="show('home')">← 메뉴</button><div class="card center">
<h2 id="title"></h2><p class="hint" id="hint"></p><div class="progress"><div id="bar" class="bar"></div></div>
<div id="body"></div><div id="feedback" class="feedback"></div><button id="next" class="next" onclick="next()">다음 →</button>
</div></section>

<section id="parent" class="screen"><button class="back" onclick="show('home')">← 메뉴</button><div class="card">
<h2>👨‍👩‍👧 부모님 모드</h2><p class="hint">정답 개수보다 <b>어떤 개념을 어려워하는지</b> 봐주세요.</p>
<div id="stats" class="stats"></div>
<div class="explain"><b>추천 학습법</b><br>틀렸을 때 바로 답을 알려주기보다 “그림을 다시 세어볼까?”, “10개를 한 묶음으로 만들어볼까?”처럼 생각할 시간을 주세요.</div>
<button class="reset" onclick="resetStats()">학습 기록 초기화</button>
</div></section>
</div>

<script>
const qs={
count:[[4],[7],[10],[13],[16],[19],[6],[12]],
add:[[2,3],[4,2],[5,3],[6,1],[7,2],[8,1]],
sub:[[5,2],[7,3],[8,4],[9,2],[6,5],[10,3]],
place:[[23],[14],[27],[31],[42],[35]],
add2:[[23,14],[31,16],[42,15],[24,23],[35,12]],
sub2:[[37,12],[46,21],[58,24],[39,15],[67,32]],
carry:[[7,5],[8,6],[27,8],[16,7],[28,15]],
borrow:[[12,5],[13,6],[32,8],[41,7],[52,18]]
};
const names={count:'1단계 · 수의 개념',ten:'2단계 · 10의 개념',add:'3단계 · 한 자리 덧셈',sub:'3단계 · 한 자리 뺄셈',place:'4단계 · 두 자리 수',add2:'5단계 · 두 자리 덧셈',sub2:'5단계 · 두 자리 뺄셈',carry:'6단계 · 받아올림',borrow:'6단계 · 받아내림'};
let mode='',i=0,score=0,answered=false,stats=JSON.parse(localStorage.getItem('mathV6Stats')||'{}');

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='parent')renderStats()}
function start(m){mode=m;i=0;score=0;answered=false;show('lesson');if(m==='ten'){tenLesson();return}render()}
const foodSets=[[{e:'🍎',n:'사과'},{e:'🍐',n:'배'}],[{e:'🍓',n:'딸기'},{e:'🍊',n:'귤'}],[{e:'🍪',n:'쿠키'},{e:'🍩',n:'도넛'}],[{e:'🐟',n:'물고기'},{e:'🐙',n:'문어'}],[{e:'🚗',n:'자동차'},{e:'🚌',n:'버스'}],[{e:'⭐',n:'별'},{e:'❤️',n:'하트'}]]; let theme=foodSets[Math.floor(Math.random()*foodSets.length)];
function objs(n,e=theme[0].e){return Array.from({length:n},()=>`<span class="obj">${e}</span>`).join('')}
function record(ok){stats[mode]??={c:0,t:0};stats[mode].t++;if(ok)stats[mode].c++;localStorage.setItem('mathV6Stats',JSON.stringify(stats))}
function answer(ok){if(answered)return;answered=true;record(ok);if(ok){score++;feedback.textContent='🎉 좋아요!';}else feedback.textContent='🌱 괜찮아요. 그림을 다시 천천히 살펴봐요.';nextBtn.style.display='inline-block'}
function buttons(correct,vals=[correct,correct-1,correct+1,correct+2]){vals=[...new Set(vals.filter(x=>x>0))].sort(()=>Math.random()-.5);return `<div class="answers">${vals.map(v=>`<button onclick="answer(${v===correct})">${v}</button>`).join('')}</div>`}
function render(){
title.textContent=names[mode];hint.textContent=mode==='count'?'그림의 개수를 세고 맞는 숫자를 골라보세요.':mode==='place'?'숫자가 몇 십과 몇 개인지 살펴보세요.':mode==='add2'||mode==='sub2'?'그림의 묶음과 낱개를 생각하며 계산해보세요.':mode==='carry'?'10개가 모이면 한 묶음이 됩니다.':mode==='borrow'?'10개짜리 한 묶음을 풀어 낱개로 바꿔볼게요.':'그림을 보고 생각한 뒤 답을 골라보세요.';
bar.style.width=(i/qs[mode].length*100)+'%';feedback.textContent='';nextBtn.style.display='none';answered=false;
let q=qs[mode][i], b='';
if(mode==='count'){let n=q[0];b=`<div class="question">몇 개일까요?</div><div class="visual">${objs(n)}</div>${buttons(n,[n,n-1,n+1,n+2])}`}
else if(mode==='add'){let[a,c]=q,n=a+c;b=`<div class="sumvisual"><div>${objs(a)}</div><b>＋</b><div>${objs(c)}</div></div><div class="question">${a} + ${c} = ?</div>${buttons(n,[n,n-1,n+1,n+2])}`}
else if(mode==='sub'){let[a,c]=q,n=a-c;b=`<div class="visual">${objs(a)}</div><div class="explain">${c}개가 사라지면 어떻게 될까요?</div><div class="question">${a} - ${c} = ?</div>${buttons(n,[n,n-1,n+1,n+2])}`}
else if(mode==='place'){let n=q[0],t=Math.floor(n/10),o=n%10;b=`<div class="question">${n}은 몇 십과 몇 일까요?</div><div class="place"><div class="placebox"><h3>십의 자리</h3><div class="blocks">${objs(t,'🟦')}</div><b>${t}십</b></div><div class="placebox"><h3>일의 자리</h3><div class="blocks">${objs(o,'🔵')}</div><b>${o}개</b></div></div><div class="explain"><b>${n} = ${t*10} + ${o}</b></div>${buttons(n,[n,t*10+o,t*10+o+1,t*10+o-1])}`}
else if(mode==='add2'||mode==='sub2'){let[a,c]=q,n=mode==='add2'?a+c:a-c;let op=mode==='add2'?'+':'−';b=`<div class="question">${a} ${op} ${c} = ?</div>${blocks(a)}<div style="font-size:30px;font-weight:900">${op}</div>${blocks(c)}<div class="explain">십의 묶음과 낱개를 따로 생각해 보세요.</div>${buttons(n,[n,n-1,n+1,n+2])}`}
else if(mode==='carry'){let[a,c]=q,n=a+c;b=`${foodLabel()}<div class="question">${a} + ${c} = ?</div>${grouped(a,theme[0].e)}<div style="font-size:30px">＋</div>${grouped(c,theme[1].e)}<div class="explain">일의 자리 ${a%10}개와 ${c%10}개를 합치면 <b>${(a%10)+(c%10)}개</b>예요.<br>10개가 모이면 <b>한 묶음</b>으로 바꿔볼 수 있어요.</div>${buttons(n,[n,n-1,n+1,n+2])}`}
else if(mode==='borrow'){let[a,c]=q,n=a-c;b=`<div class="question">${a} − ${c} = ?</div>${blocks(a)}<div class="explain">${a%10}개에서는 ${c%10}개를 뺄 수 없을 때, <b>10개짜리 한 묶음을 풀어</b> 낱개로 바꿔요.</div>${buttons(n,[n,n-1,n+1,n+2])}`}
body.innerHTML=b
}
function blocks(n){let t=Math.floor(n/10),o=n%10;return `<div class="place"><div class="placebox"><b>${t}개의 십 묶음</b><div class="blocks">${Array.from({length:t},()=>'<div class="ten">10</div>').join('')}</div></div><div class="placebox"><b>${o}개의 낱개</b><div class="blocks">${Array.from({length:o},()=>'<div class="one">●</div>').join('')}</div></div></div>`}
function next(){i++;if(i>=qs[mode].length){bar.style.width='100%';body.innerHTML=`<div style="font-size:70px">🏆</div><div class="question">참 잘했어요!</div><p>이번 활동에서 <b>${score} / ${qs[mode].length}</b> 문제를 맞혔어요.</p><div class="explain">점수보다 중요한 것은 <b>그림과 묶음을 이해하는 것</b>이에요. 어려웠다면 같은 단계를 다시 해도 좋습니다.</div>`;feedback.textContent='';nextBtn.style.display='none'}else render()}
function tenLesson(){title.textContent=names.ten;hint.textContent='6개에서 시작해서 10개가 되도록 만들어 보세요.';bar.style.width='0';feedback.textContent='';nextBtn.style.display='none';body.innerHTML=`<div class="question">몇 개를 더하면 10개가 될까요?</div><div class="tenboard"><div class="zone"><h3>🍎 더 가져오기</h3>${Array.from({length:4},()=>'<div class="dragitem" onclick="addTen()">🍎</div>').join('')}</div><div class="zone"><h3>🔟 10 만들기</h3><div id="tenObjs">${objs(6)}</div></div></div><p class="hint">사과를 눌러 오른쪽으로 하나씩 가져와도 좋아요.</p><div class="choice"><button onclick="checkTen()">완성했어요!</button></div>`}
function addTen(){let n=document.querySelectorAll('#tenObjs .obj').length;if(n<10){document.getElementById('tenObjs').innerHTML=objs(n+1);feedback.textContent=`지금 ${n+1}개예요.`}}
function checkTen(){let n=document.querySelectorAll('#tenObjs .obj').length;stats.ten??={c:0,t:0};stats.ten.t++;if(n===10){stats.ten.c++;feedback.textContent='🎉 10개가 되었어요! 10은 한 묶음으로 생각할 수 있어요.'}else feedback.textContent=`지금 ${n}개예요. 10개가 되려면 조금 더 필요해요.`;localStorage.setItem('mathV6Stats',JSON.stringify(stats))}
function renderStats(){let order=['count','ten','add','sub','place','add2','sub2','carry','borrow'];statsEl=document.getElementById('stats');statsEl.innerHTML=order.map(k=>{let s=stats[k]||{c:0,t:0};return `<div class="stat"><span>${names[k]}</span><span>${s.t?`${s.c}/${s.t}`:'학습 전'}</span></div>`}).join('')}
function resetStats(){if(confirm('학습 기록을 초기화할까요?')){stats={};localStorage.removeItem('mathV6Stats');renderStats()}}
const feedback=document.getElementById('feedback'),nextBtn=document.getElementById('next'),title=document.getElementById('title'),hint=document.getElementById('hint'),bar=document.getElementById('bar'),body=document.getElementById('body');
</script>
</body></html>
